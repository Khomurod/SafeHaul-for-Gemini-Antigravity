name: SafeHaul CI/CD Watchdog

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-frontend:
    name: Frontend (React/Vite) Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Linter (Grammar Check)
      run: npm run lint:frontend

    - name: Run Unit Tests
      run: npx vitest run

    - name: Test Production Build (Assembly Test)
      run: npm run build


  test-functions:
    name: Backend (Cloud Functions) Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./functions

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: functions/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Run Linter (Grammar Check)
      run: npm run lint

    - name: Run Unit Tests
      env:
        # Needed for bulkActions initialization tests
        PROCESS_BULK_BATCH_URL: 'http://127.0.0.1:5001/test-project/us-central1/processBulkBatch'
      run: npm test
