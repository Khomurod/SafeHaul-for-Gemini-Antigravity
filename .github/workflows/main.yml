name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Expose repo Secrets to Vite as env vars (same names as root .env — must match VITE_ prefix).
env:
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
  VITE_FACEBOOK_APP_ID: ${{ secrets.VITE_FACEBOOK_APP_ID }}
  VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
  VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.VITE_SENTRY_TRACES_SAMPLE_RATE }}
  VITE_SUPER_ADMIN_EMAIL: ${{ secrets.VITE_SUPER_ADMIN_EMAIL }}
  VITE_DRIVER_APP_URL: ${{ secrets.VITE_DRIVER_APP_URL }}
  PROCESS_BULK_BATCH_URL: ${{ secrets.PROCESS_BULK_BATCH_URL }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # Full history so Gitleaks can resolve base..head (merge pushes need both parents' ancestry).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./functions

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - run: npm ci
      - run: npm run build

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Frontend Lint
        run: npm run lint:frontend

      - name: Frontend Unit Tests
        run: npm test -- --run

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Frontend E2E Tests (Chromium)
        run: npm run test:e2e -- --project=chromium

  callable-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
      - name: Verify frontend/backend callable contract
        run: node scripts/check-callable-contract.mjs

  deploy-hosting:
    name: Deploy Firebase Hosting and Rules
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - test-functions
      - frontend-build
      - frontend-quality
      - callable-contract
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: firebase-hosting-live
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      FIREBASE_PROJECT_ID: truckerapp-system

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRUCKERAPP_SYSTEM }}'
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Deploy Firebase Hosting
        run: npx firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Deploy Firestore and Storage Rules
        run: npx firebase deploy --only firestore:rules,firestore:indexes,storage --project "$FIREBASE_PROJECT_ID" --non-interactive

  # Deploy uses the service account in FIREBASE_SERVICE_ACCOUNT_TRUCKERAPP_SYSTEM. If deploy fails with
  # firebaseextensions.googleapis.com 403, add IAM role "Firebase Extensions Viewer" to that account.
  deploy-functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - test-functions
      - frontend-build
      - frontend-quality
      - callable-contract
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: firebase-functions-live
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      FIREBASE_PROJECT_ID: truckerapp-system

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRUCKERAPP_SYSTEM }}'
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      # Root lockfile pins firebase-tools; without this, npx downloads a random CLI each run.
      - name: Install repo dependencies (Firebase CLI from package-lock)
        run: npm ci

      - name: Install Functions Dependencies
        run: npm ci
        working-directory: ./functions

      # Legacy trigger removed from driverSync.js — Cloud still had it; deploy --non-interactive refuses to delete without confirmation.
      # Safe to ignore failure once the function is already gone (continue-on-error).
      - name: Delete retired function onLeadSubmitted (if present)
        continue-on-error: true
        run: npx firebase functions:delete onLeadSubmitted --region us-central1 --project "$FIREBASE_PROJECT_ID" --non-interactive --force

      # Use local firebase binary so version matches package-lock.json
      - name: Deploy Cloud Functions
        run: npx firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Post-deploy smoke check
        run: node scripts/smoke-functions-deploy.mjs
