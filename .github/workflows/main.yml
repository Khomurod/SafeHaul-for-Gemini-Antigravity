name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Expose repo Secrets to Vite as env vars (same names as root .env — must match VITE_ prefix).
env:
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_FACEBOOK_APP_ID: ${{ secrets.VITE_FACEBOOK_APP_ID }}
  VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
  VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.VITE_SENTRY_TRACES_SAMPLE_RATE }}
  VITE_SUPER_ADMIN_EMAIL: ${{ secrets.VITE_SUPER_ADMIN_EMAIL }}
  VITE_DRIVER_APP_URL: ${{ secrets.VITE_DRIVER_APP_URL }}
  VITE_SOCRATA_APP_TOKEN: ${{ secrets.VITE_SOCRATA_APP_TOKEN }}
  PROCESS_BULK_BATCH_URL: ${{ secrets.PROCESS_BULK_BATCH_URL }}
  BULK_WORKER_SECRET: ${{ secrets.BULK_WORKER_SECRET }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # Full history so Gitleaks can resolve base..head (merge pushes need both parents' ancestry).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./functions

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - run: npm ci
      - run: npm run build

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Frontend Lint
        run: npm run lint:frontend

      - name: Frontend Unit Tests
        run: npm test -- --run

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Frontend E2E Tests (Chromium)
        run: npm run test:e2e -- --project=chromium

  callable-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
      - name: Verify frontend/backend callable contract
        run: node scripts/check-callable-contract.mjs

  rules-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Run Firestore/Storage rules tests with emulators
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
        run: npx firebase emulators:exec --only firestore,storage "npm test -- --run src/tests/firestore.rules.security.test.js src/tests/storage.rules.security.test.js"

  deploy-hosting:
    name: Deploy Firebase Hosting and Rules
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - test-functions
      - frontend-build
      - frontend-quality
      - callable-contract
      - rules-emulator
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: firebase-hosting-live
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      FIREBASE_PROJECT_ID: truckerapp-system

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRUCKERAPP_SYSTEM }}'
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Deploy Firebase Hosting
        run: npx firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive

      # Rules + Storage first so an indexes IAM issue does not block rule rollouts.
      #
      # If "Deploy Firestore indexes" returns HTTP 403 on .../collectionGroups/.../indexes:
      # 1. Open the JSON in GitHub secret FIREBASE_SERVICE_ACCOUNT_TRUCKERAPP_SYSTEM and copy "client_email".
      # 2. GCP Console → IAM & Admin → Grant access → paste THAT email (it may differ from firebase-adminsdk-*).
      # 3. Add role: "Cloud Datastore Index Admin" (IAM role id: roles/datastore.indexAdmin).
      # 4. Save; re-run the workflow. Rules/storage deploy above should already succeed.
      #
      # Optional CLI equivalent (run locally as Owner): 
      #   gcloud projects add-iam-policy-binding truckerapp-system \
      #     --member="serviceAccount:PASTE_CLIENT_EMAIL" \
      #     --role="roles/datastore.indexAdmin"
      #
      # Note: Firebase may warn about indexes present in the project but not in firestore.indexes.json — 
      # that does not cause 403; 403 is always missing IAM on the CI service account.
      - name: Deploy Firestore rules and Storage rules
        run: npx firebase deploy --only firestore:rules,storage --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Deploy Firestore indexes
        run: npx firebase deploy --only firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive

  # Deploy uses the service account in FIREBASE_SERVICE_ACCOUNT_TRUCKERAPP_SYSTEM. If deploy fails with
  # firebaseextensions.googleapis.com 403, add IAM role "Firebase Extensions Viewer" to that account.
  deploy-functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - test-functions
      - frontend-build
      - frontend-quality
      - callable-contract
      - rules-emulator
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: firebase-functions-live
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      FIREBASE_PROJECT_ID: truckerapp-system

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRUCKERAPP_SYSTEM }}'
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      # Root lockfile pins firebase-tools; without this, npx downloads a random CLI each run.
      - name: Install repo dependencies (Firebase CLI from package-lock)
        run: npm ci

      - name: Install Functions Dependencies
        run: npm ci
        working-directory: ./functions

      # Inject runtime env vars consumed by Functions code (process.env.*).
      # Repo-level GitHub Secrets are NOT auto-propagated into Firebase runtime;
      # creating functions/.env ensures firebase deploy uploads these vars.
      #
      # Use env + printf (not echo "${{ secrets... }}") so shell metacharacters cannot break the file,
      # and fail fast if the secret is missing in this workflow context (fork PRs, typos, etc.).
      - name: Write Functions runtime env file
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PROCESS_BULK_BATCH_URL: ${{ secrets.PROCESS_BULK_BATCH_URL }}
          BULK_WORKER_SECRET: ${{ secrets.BULK_WORKER_SECRET }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::secrets.GROQ_API_KEY is empty or not exposed to this job. Fix the secret name, repo Actions permissions, or avoid deploy workflows from contexts without secrets."
            exit 1
          fi
          if [ -z "$PROCESS_BULK_BATCH_URL" ]; then
            echo "::error::secrets.PROCESS_BULK_BATCH_URL is empty. Bulk campaigns require the processBulkBatch Cloud Run URL (see docs/production-readiness-runbook.md)."
            exit 1
          fi
          if [ -z "$BULK_WORKER_SECRET" ]; then
            echo "::error::secrets.BULK_WORKER_SECRET is empty. Set a strong shared secret for processBulkBatch worker auth."
            exit 1
          fi
          printf '%s\n' \
            "GROQ_API_KEY=$GROQ_API_KEY" \
            "GROQ_VISION_MODEL=meta-llama/llama-4-scout-17b-16e-instruct" \
            "PROCESS_BULK_BATCH_URL=$PROCESS_BULK_BATCH_URL" \
            "BULK_WORKER_SECRET=$BULK_WORKER_SECRET" \
            > functions/.env
          node -e "const fs=require('fs');const t=fs.readFileSync('functions/.env','utf8');const groq=t.match(/^GROQ_API_KEY=(.+)$/m);if(!groq||groq[1].length<8){console.error('GROQ_API_KEY in functions/.env is too short');process.exit(1)}const url=t.match(/^PROCESS_BULK_BATCH_URL=(.+)$/m);if(!url||!url[1].startsWith('https://')){console.error('PROCESS_BULK_BATCH_URL must be a https URL');process.exit(1)}const sec=t.match(/^BULK_WORKER_SECRET=(.+)$/m);if(!sec||sec[1].length<16){console.error('BULK_WORKER_SECRET must be at least 16 characters');process.exit(1)}console.log('functions/.env: GROQ_API_KEY, PROCESS_BULK_BATCH_URL, BULK_WORKER_SECRET present');"

      # Legacy trigger removed from driverSync.js — Cloud still had it; deploy --non-interactive refuses to delete without confirmation.
      # Safe to ignore failure once the function is already gone (continue-on-error).
      - name: Delete retired function onLeadSubmitted (if present)
        continue-on-error: true
        run: npx firebase functions:delete onLeadSubmitted --region us-central1 --project "$FIREBASE_PROJECT_ID" --non-interactive --force

      - name: Validate function export wiring parser
        run: npm run check:function-exports

      - name: Validate incremental deploy planner behavior
        run: npm run check:deploy-script

      # Incremental strict mode: deploy only changed/mapped runtime functions.
      # Never auto-full-deploy; explicit full deploy requires DEPLOY_FUNCTIONS_FORCE_FULL=1.
      - name: Deploy Cloud Functions (incremental or full)
        env:
          GITHUB_PUSH_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          DEPLOY_FUNCTIONS_SLEEP_SEC: '0'
          DEPLOY_FUNCTIONS_ALWAYS_INCLUDE: parseCdlWithGroq,initBulkSession,processBulkBatch
        run: |
          max_attempts=3
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Deploy attempt $attempt/$max_attempts"
            if node scripts/deploy-functions-incremental.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Deploy failed after $max_attempts attempts."
              exit 1
            fi
            echo "Transient deploy failure; retrying in 20 seconds..."
            sleep 20
            attempt=$((attempt + 1))
          done

      - name: Post-deploy smoke check
        run: node scripts/smoke-functions-deploy.mjs
